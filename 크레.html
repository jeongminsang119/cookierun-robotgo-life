<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇고 주식거래소</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #1a1f2e;
            --bg-tertiary: #252b3d;
            --text-primary: #ffffff;
            --text-secondary: #b8bcc8;
            --text-muted: #6b7280;
            --border-color: #374151;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --rise-color: #ff4757;
            --fall-color: #3742fa;
        }
        
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #e2e8f0;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
        }
        
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            color: white;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .logo {
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .market-status {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .balance-info {
            background: rgba(255,255,255,0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
        }
        
        .version-selector select {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 12px;
        }
        
        .version-selector select:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .version-selector select option {
            background: #1e40af;
            color: white;
        }
        
        .theme-toggle {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .theme-toggle:hover {
            background: rgba(255,255,255,0.3);
        }
        
        .main-container {
            display: grid;
            grid-template-columns: 280px 1fr 320px;
            height: calc(100vh - 60px);
            gap: 1px;
            background: var(--border-color);
        }
        
        .left-panel, .right-panel {
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .center-panel {
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .panel-header {
            background: var(--bg-tertiary);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        
        /* 주식 목록 스타일 */
        .stock-item {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 3px solid transparent;
            font-size: 13px;
        }
        
        .stock-item:hover {
            background: var(--bg-tertiary);
        }
        
        .stock-item.selected {
            background: var(--bg-tertiary);
            border-left-color: var(--accent-blue);
        }
        
        .stock-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .stock-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .stock-code {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .stock-price-info {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .stock-price {
            font-weight: 600;
            font-size: 13px;
        }
        
        .stock-change {
            font-size: 11px;
            font-weight: 500;
        }
        
        .positive { color: var(--rise-color); }
        .negative { color: var(--fall-color); }
        
        /* 차트 컨테이너 */
        .chart-header {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .chart-controls {
            display: flex;
            gap: 8px;
        }
        
        .chart-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .chart-btn:hover, .chart-btn.active {
            background: var(--accent-blue);
            color: white;
        }
        
        .chart-container {
            flex: 1;
            position: relative;
            background: var(--bg-primary);
            overflow: hidden;
        }
        
        .chart-canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        
        .chart-tools {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.8);
            padding: 6px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            opacity: 0.7;
            transition: opacity 0.3s;
        }
        
        .chart-tools:hover {
            opacity: 1;
        }
        
        .tool-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 4px 6px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
            min-width: 30px;
            transition: all 0.2s;
        }
        
        .tool-btn:hover, .tool-btn.active {
            background: var(--accent-blue);
            color: white;
        }
        
        /* 호가창 스타일 */
        .orderbook {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 11px;
            background: var(--bg-primary);
        }
        
        .orderbook-header {
            display: grid;
            grid-template-columns: 60px 80px 60px;
            padding: 6px 4px;
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            font-weight: 700;
            text-align: center;
            font-size: 10px;
            color: #e2e8f0;
            border-bottom: 2px solid #4a5568;
        }
        
        .orderbook-section {
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 2px;
        }
        
        .orderbook-row {
            display: grid;
            grid-template-columns: 60px 80px 60px;
            padding: 2px 4px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background-color 0.15s;
            cursor: pointer;
            position: relative;
        }
        
        .orderbook-row:hover {
            background: rgba(255,255,255,0.05) !important;
        }
        
        .orderbook-row.ask {
            background: linear-gradient(90deg, transparent 0%, rgba(59, 130, 246, 0.08) 100%);
            border-left: 2px solid #3b82f6;
        }
        
        .orderbook-row.ask .price {
            color: #3b82f6;
            font-weight: 600;
        }
        
        .orderbook-row.bid {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.08) 0%, transparent 100%);
            border-left: 2px solid #ef4444;
        }
        
        .orderbook-row.bid .price {
            color: #ef4444;
            font-weight: 600;
        }
        
        .orderbook-row.current {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            color: #000;
            font-weight: 800;
            border: 2px solid #d97706;
            animation: pulse-price 1s infinite;
        }
        
        @keyframes pulse-price {
            0%, 100% { box-shadow: 0 0 5px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 15px rgba(251, 191, 36, 0.8); }
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        
        .quantity {
            font-size: 10px;
            color: var(--text-muted);
        }
        
        .price {
            font-weight: 600;
            font-size: 11px;
        }
        
        .orderbook-row.ask .quantity {
            color: #93c5fd;
        }
        
        .orderbook-row.bid .quantity {
            color: #fca5a5;
        }
        
        .spread-info {
            background: var(--bg-tertiary);
            padding: 4px 8px;
            text-align: center;
            font-size: 10px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        
        /* 거래 패널 */
        .trade-form {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .form-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .form-input, .form-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 13px;
            transition: border-color 0.2s;
        }
        
        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }
        
        .btn-buy, .btn-sell {
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 13px;
        }
        
        .btn-buy {
            background: var(--rise-color);
            color: white;
        }
        
        .btn-buy:hover {
            background: #ff3742;
            transform: translateY(-1px);
        }
        
        .btn-sell {
            background: var(--fall-color);
            color: white;
        }
        
        .btn-sell:hover {
            background: #2f3cfa;
            transform: translateY(-1px);
        }
        
        /* 포트폴리오 */
        .portfolio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            margin-bottom: 4px;
            font-size: 12px;
        }
        
        .portfolio-name {
            font-weight: 600;
        }
        
        .portfolio-quantity {
            color: var(--text-muted);
            font-size: 11px;
        }
        
        .portfolio-value {
            text-align: right;
        }
        
        /* 기술적 지표 패널 */
        .indicators-panel {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: 12px;
        }
        
        .indicator-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 12px;
        }
        
        .indicator-name {
            font-weight: 500;
        }
        
        .indicator-value {
            font-weight: 600;
        }
        
        /* 체결내역 */
        .trades-list {
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }
        
        .trade-item {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 2px 8px;
            text-align: right;
        }
        
        .trade-item:nth-child(even) {
            background: rgba(255,255,255,0.02);
        }
        

        
        /* 모바일 레이아웃 */
        .mobile-layout {
            display: none;
        }
        
        .mobile-layout.active {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 60px);
        }
        
        .mobile-main-container {
            display: grid;
            grid-template-rows: 300px 1fr 200px;
            height: 100%;
            gap: 1px;
            background: var(--border-color);
        }
        
        /* 상단: 차트 */
        .mobile-chart-section {
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }
        
        .mobile-chart-header {
            background: var(--bg-secondary);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .mobile-chart-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .mobile-chart-controls {
            display: flex;
            gap: 4px;
        }
        
        .mobile-chart-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.2s;
        }
        
        .mobile-chart-btn:hover, .mobile-chart-btn.active {
            background: var(--accent-blue);
            color: white;
        }
        
        .mobile-chart-container {
            height: calc(100% - 45px);
            position: relative;
            background: var(--bg-primary);
        }
        
        /* 중단: 종목 리스트 + 호가창 */
        .mobile-middle-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border-color);
        }
        
        .mobile-stocks-panel, .mobile-orderbook-panel {
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .mobile-panel-header {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .mobile-panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 4px;
        }
        
        .mobile-stock-item {
            display: grid;
            grid-template-columns: 1fr auto;
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 2px;
            cursor: pointer;
            transition: all 0.15s;
            border-left: 2px solid transparent;
            font-size: 11px;
        }
        
        .mobile-stock-item:hover {
            background: var(--bg-tertiary);
        }
        
        .mobile-stock-item.selected {
            background: var(--bg-tertiary);
            border-left-color: var(--accent-blue);
        }
        
        .mobile-stock-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        
        .mobile-stock-name {
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
        }
        
        .mobile-stock-code {
            font-size: 9px;
            color: var(--text-muted);
        }
        
        .mobile-stock-price-info {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }
        
        .mobile-stock-price {
            font-weight: 600;
            font-size: 11px;
        }
        
        .mobile-stock-change {
            font-size: 9px;
            font-weight: 500;
        }
        
        /* 호가창 */
        .mobile-orderbook {
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 9px;
            background: var(--bg-primary);
        }
        
        .mobile-orderbook-header {
            display: grid;
            grid-template-columns: 50px 60px 40px;
            padding: 4px 2px;
            background: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            font-weight: 700;
            text-align: center;
            font-size: 8px;
            color: #e2e8f0;
            border-bottom: 1px solid #4a5568;
        }
        
        .mobile-orderbook-row {
            display: grid;
            grid-template-columns: 50px 60px 40px;
            padding: 1px 2px;
            text-align: right;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background-color 0.15s;
            cursor: pointer;
            position: relative;
        }
        
        .mobile-orderbook-row:hover {
            background: rgba(255,255,255,0.05) !important;
        }
        
        .mobile-orderbook-row.ask {
            background: linear-gradient(90deg, transparent 0%, rgba(59, 130, 246, 0.08) 100%);
            border-left: 1px solid #3b82f6;
        }
        
        .mobile-orderbook-row.ask .price {
            color: #3b82f6;
            font-weight: 600;
        }
        
        .mobile-orderbook-row.bid {
            background: linear-gradient(90deg, rgba(239, 68, 68, 0.08) 0%, transparent 100%);
            border-left: 1px solid #ef4444;
        }
        
        .mobile-orderbook-row.bid .price {
            color: #ef4444;
            font-weight: 600;
        }
        
        .mobile-orderbook-row.current {
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            color: #000;
            font-weight: 800;
            border: 1px solid #d97706;
        }
        
        /* 하단: 거래 + 포트폴리오 */
        .mobile-bottom-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border-color);
        }
        
        .mobile-trade-panel, .mobile-portfolio-panel {
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .mobile-trade-form {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }
        
        .mobile-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
        }
        
        .mobile-form-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        
        .mobile-form-group.full-width {
            grid-column: 1 / -1;
        }
        
        .mobile-form-label {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .mobile-form-input, .mobile-form-select {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 6px 8px;
            border-radius: 4px;
            font-size: 11px;
            transition: border-color 0.2s;
        }
        
        .mobile-form-input:focus, .mobile-form-select:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .mobile-trade-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-top: 4px;
        }
        
        .mobile-btn-buy, .mobile-btn-sell {
            padding: 8px;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 11px;
        }
        
        .mobile-btn-buy {
            background: var(--rise-color);
            color: white;
        }
        
        .mobile-btn-buy:hover {
            background: #ff3742;
            transform: translateY(-1px);
        }
        
        .mobile-btn-sell {
            background: var(--fall-color);
            color: white;
        }
        
        .mobile-btn-sell:hover {
            background: #2f3cfa;
            transform: translateY(-1px);
        }
        
        /* 포트폴리오 */
        .mobile-portfolio-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
            background: var(--bg-tertiary);
            border-radius: 4px;
            margin-bottom: 2px;
            font-size: 10px;
        }
        
        .mobile-portfolio-name {
            font-weight: 600;
        }
        
        .mobile-portfolio-quantity {
            color: var(--text-muted);
            font-size: 9px;
        }
        
        .mobile-portfolio-value {
            text-align: right;
        }
        
        /* 스크롤바 모바일 최적화 */
        .mobile-panel-content::-webkit-scrollbar {
            width: 3px;
        }

        // 캔버스 크기 조정
        function resizeCanvas() {
            if (!canvas) return;
            const container = canvas.parentElement;
            if (!container) return;
            
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            
            // 캔버스가 실제로 크기를 가지고 있을 때만 차트 그리기
            if (canvas.width > 0 && canvas.height > 0) {
                setTimeout(() => {
                    drawChart();
                }, 50);
            }
        }

        // 초기 데이터 생성
        function generateInitialHistory(basePrice) {
            const history = [];
            let price = basePrice;
            
            for (let i = 0; i < 100; i++) {
                const change = (Math.random() - 0.5) * price * 0.03;
                price = Math.max(price + change, basePrice * 0.7);
                history.push(Math.round(price));
            }
            
            return history;
        }

        function generateCandleData(basePrice) {
            const candleData = [];
            let price = basePrice;
            
            for (let i = 0; i < 200; i++) {
                const open = price;
                const changePercent = (Math.random() - 0.5) * 0.06;
                const close = Math.max(open * (1 + changePercent), basePrice * 0.5);
                
                const volatility = Math.random() * 0.02;
                const high = Math.max(open, close) * (1 + volatility);
                const low = Math.min(open, close) * (1 - volatility);
                
                const volume = Math.floor(Math.random() * 500000) + 100000;
                
                candleData.push({
                    open: Math.round(open),
                    high: Math.round(high),
                    low: Math.round(low),
                    close: Math.round(close),
                    volume: volume,
                    timestamp: Date.now() - (200 - i) * 60000
                });
                
                price = close;
            }
            
            return candleData;
        }

        function generateOrderbook(price) {
            const orderbook = { bids: [], asks: [] };
            
            // 세력 등장 확률 (5%)
            const hasWhale = Math.random() < 0.05;
            const whaleType = Math.random() > 0.5 ? 'buy' : 'sell';
            const whaleSize = Math.floor(Math.random() * 50000) + 30000; // 3만~8만주
            
            // 매수 호가 (현재가 아래)
            for (let i = 1; i <= 10; i++) {
                const bidPrice = price - (i * 500);
                let quantity = Math.floor(Math.random() * 10000) + 1000;
                
                // 세력 매수 물량
                if (hasWhale && whaleType === 'buy' && i <= 3) {
                    quantity = whaleSize / (4 - i); // 상위 호가에 더 많은 물량
                }
                
                orderbook.bids.push({ 
                    price: bidPrice, 
                    quantity: Math.floor(quantity),
                    isWhale: hasWhale && whaleType === 'buy' && i <= 3
                });
            }
            
            // 매도 호가 (현재가 위)
            for (let i = 1; i <= 10; i++) {
                const askPrice = price + (i * 500);
                let quantity = Math.floor(Math.random() * 10000) + 1000;
                
                // 세력 매도 물량
                if (hasWhale && whaleType === 'sell' && i <= 3) {
                    quantity = whaleSize / (4 - i);
                }
                
                orderbook.asks.push({ 
                    price: askPrice, 
                    quantity: Math.floor(quantity),
                    isWhale: hasWhale && whaleType === 'sell' && i <= 3
                });
            }
            
            // 세력 정보 저장
            orderbook.whaleInfo = hasWhale ? {
                type: whaleType,
                size: whaleSize,
                timestamp: Date.now()
            } : null;
            
            return orderbook;
        }

        function generateTrades(price) {
            const trades = [];
            const now = Date.now();
            
            for (let i = 0; i < 20; i++) {
                const tradePrice = price + (Math.random() - 0.5) * 1000;
                const quantity = Math.floor(Math.random() * 1000) + 100;
                const time = new Date(now - i * 30000);
                
                trades.push({
                    price: Math.round(tradePrice),
                    quantity: quantity,
                    time: time.toLocaleTimeString(),
                    type: Math.random() > 0.5 ? 'buy' : 'sell'
                });
            }
            
            return trades.reverse();
        }

                                stock.changePercent > 1 ? '📈' : 
                                stock.changePercent < -3 ? '💥' : 
                                stock.changePercent < -1 ? '📉' : '➡️';
                
                stockItem.innerHTML = `
                    <div class="stock-info">
                        <div class="stock-name">${trendEmoji} ${stock.name}</div>
                        <div class="stock-code">${stock.code}</div>

                    </div>
                    <div class="stock-price-info">
                        <div class="stock-price">₩${stock.price.toLocaleString()}</div>
                        <div class="stock-change ${changeClass}">
                            ${changeSign}${stock.change.toLocaleString()} (${changeSign}${stock.changePercent}%)
                        </div>
                    </div>
                `;
                
                stockList.appendChild(stockItem);
            });
        }

        // 주식 선택
        function selectStock(stockCode) {
            gameState.selectedStock = stockCode;
            const stock = gameState.stocks[stockCode];
            
            // 차트 헤더 업데이트
            document.getElementById('chartStockName').textContent = stock.name;
            
            const changeClass = stock.change >= 0 ? 'positive' : 'negative';
            const changeSign = stock.change >= 0 ? '+' : '';
            document.getElementById('chartStockPrice').textContent = 
                `₩${stock.price.toLocaleString()} (${changeSign}${stock.change.toLocaleString()})`;
            document.getElementById('chartStockPrice').className = changeClass;
            

            
            // 기술적 지표 업데이트
            document.getElementById('rsiValue').textContent = stock.indicators.rsi.toFixed(1);
            document.getElementById('macdValue').textContent = 
                (stock.indicators.macd >= 0 ? '+' : '') + stock.indicators.macd.toFixed(1);
            document.getElementById('macdValue').className = 
                `indicator-value ${stock.indicators.macd >= 0 ? 'positive' : 'negative'}`;
            document.getElementById('bollingerValue').textContent = stock.indicators.bollinger.toFixed(2);
            document.getElementById('volumeStrength').textContent = 
                Math.round(stock.volume / 500000 * 100) + '%';
            
            renderStockList();
            renderOrderbook();
            renderTrades();
            drawChart();
            updateEstimatedAmount();
        }

        // 호가창 렌더링
        function renderOrderbook() {
            const stock = gameState.stocks[gameState.selectedStock];
            const orderbookList = document.getElementById('orderbookList');
            orderbookList.innerHTML = '';
            
            // 세력 알림 표시
            if (stock.orderbook.whaleInfo) {
                const whaleAlert = document.createElement('div');
                whaleAlert.className = 'whale-alert';
                whaleAlert.style.cssText = `
                    background: linear-gradient(45deg, #ffc107, #ff8f00);
                    color: #000;
                    padding: 6px 8px;
                    text-align: center;
                    font-size: 11px;
                    font-weight: bold;
                    margin-bottom: 4px;
                    border-radius: 4px;
                    animation: pulse 1s infinite;
                `;
                const whaleType = stock.orderbook.whaleInfo.type === 'buy' ? '매수세력' : '매도세력';
                const whaleSize = (stock.orderbook.whaleInfo.size / 10000).toFixed(1);
                whaleAlert.innerHTML = `🐋 ${whaleType} 등장! ${whaleSize}만주`;
                orderbookList.appendChild(whaleAlert);
            }
            
            // 매도 호가 섹션 (위에서부터, 높은 가격부터)
            const askSection = document.createElement('div');
            askSection.className = 'orderbook-section';
            
            stock.orderbook.asks.slice().reverse().slice(0, 5).forEach((ask, index) => {
                const row = document.createElement('div');
                row.className = 'orderbook-row ask';
                row.onclick = () => setOrderPrice(ask.price);
                
                // 잔량 바 표시를 위한 최대값 계산
                const maxQuantity = Math.max(...stock.orderbook.asks.map(a => a.quantity));
                const barWidth = (ask.quantity / maxQuantity) * 100;
                
                row.innerHTML = `
                    <div class="quantity">${ask.quantity.toLocaleString()}${ask.isWhale ? ' 🐋' : ''}</div>
                    <div class="price">₩${ask.price.toLocaleString()}</div>
                    <div class="quantity"></div>
                `;
                
                // 잔량 표시 바 (세력 물량은 더 진한 색상)
                const bgColor = ask.isWhale ? 'rgba(255, 193, 7, 0.3)' : 'rgba(59, 130, 246, 0.15)';
                row.style.background = `linear-gradient(90deg, transparent ${100-barWidth}%, ${bgColor} 100%)`;
                
                if (ask.isWhale) {
                    row.style.borderLeft = '3px solid #ffc107';
                    row.style.fontWeight = 'bold';
                }
                
                askSection.appendChild(row);
            });
            orderbookList.appendChild(askSection);
            
            // 스프레드 정보
            const bestAsk = Math.min(...stock.orderbook.asks.map(a => a.price));
            const bestBid = Math.max(...stock.orderbook.bids.map(b => b.price));
            const spread = bestAsk - bestBid;
            const spreadPercent = ((spread / stock.price) * 100).toFixed(3);
            
            const spreadRow = document.createElement('div');
            spreadRow.className = 'spread-info';
            spreadRow.innerHTML = `스프레드: ₩${spread.toLocaleString()} (${spreadPercent}%)`;
            orderbookList.appendChild(spreadRow);
            
            // 현재가
            const currentRow = document.createElement('div');
            currentRow.className = 'orderbook-row current';
            currentRow.innerHTML = `
                <div style="font-size: 9px;">현재가</div>
                <div class="price">₩${stock.price.toLocaleString()}</div>
                <div style="font-size: 9px;">${stock.change >= 0 ? '▲' : '▼'}</div>
            `;
            orderbookList.appendChild(currentRow);
            
            // 매수 호가 섹션
            const bidSection = document.createElement('div');
            bidSection.className = 'orderbook-section';
            
            stock.orderbook.bids.slice(0, 5).forEach((bid, index) => {
                const row = document.createElement('div');
                row.className = 'orderbook-row bid';
                row.onclick = () => setOrderPrice(bid.price);
                
                // 잔량 바 표시를 위한 최대값 계산
                const maxQuantity = Math.max(...stock.orderbook.bids.map(b => b.quantity));
                const barWidth = (bid.quantity / maxQuantity) * 100;
                
                row.innerHTML = `
                    <div class="quantity">${bid.quantity.toLocaleString()}${bid.isWhale ? ' 🐋' : ''}</div>
                    <div class="price">₩${bid.price.toLocaleString()}</div>
                    <div class="quantity"></div>
                `;
                
                // 잔량 표시 바 (세력 물량은 더 진한 색상)
                const bgColor = bid.isWhale ? 'rgba(255, 193, 7, 0.3)' : 'rgba(239, 68, 68, 0.15)';
                row.style.background = `linear-gradient(90deg, ${bgColor} 0%, transparent ${barWidth}%)`;
                
                if (bid.isWhale) {
                    row.style.borderLeft = '3px solid #ffc107';
                    row.style.fontWeight = 'bold';
                }
                
                bidSection.appendChild(row);
            });
            orderbookList.appendChild(bidSection);
        }
        
        // 호가 클릭시 주문가격 설정
        function setOrderPrice(price) {
            document.getElementById('limitPrice').value = price;
            document.getElementById('orderType').value = 'limit';
            toggleLimitPrice();
            updateEstimatedAmount();
        }

        // 체결내역 렌더링
        function renderTrades() {
            const stock = gameState.stocks[gameState.selectedStock];
            const tradesList = document.getElementById('tradesList');
            tradesList.innerHTML = '';
            
            stock.trades.slice(-15).forEach(trade => {
                const row = document.createElement('div');
                row.className = `trade-item ${trade.type === 'buy' ? 'positive' : 'negative'}`;
                row.innerHTML = `
                    <div>${trade.time}</div>
                    <div>₩${trade.price.toLocaleString()}</div>
                    <div>${trade.quantity.toLocaleString()}</div>
                `;
                tradesList.appendChild(row);
            });
        }

        // 차트 그리기
        function drawChart() {
            if (!canvas || !ctx) {
                console.log('Canvas or context not available');
                return;
            }
            
            if (canvas.width === 0 || canvas.height === 0) {
                console.log('Canvas has no size');
                return;
            }
            
            const stock = gameState.stocks[gameState.selectedStock];
            if (!stock || !stock.candleData || stock.candleData.length === 0) {
                console.log('No stock data available');
                return;
            }
            
            const candleData = stock.candleData;
            
            // 캔버스 클리어
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const width = canvas.width;
            const height = canvas.height;
            
            // 모바일 버전인지 확인
            const isMobile = canvas.id === 'mobileMainChart';
            const padding = isMobile ? 
                { top: 20, right: 40, bottom: 40, left: 40 } : 
                { top: 40, right: 80, bottom: 100, left: 60 };
            
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            if (chartWidth <= 0 || chartHeight <= 0) {
                console.log('Invalid chart dimensions');
                return;
            }
            
            // 배경
            const isDark = gameState.theme === 'dark';
            ctx.fillStyle = isDark ? '#0a0e1a' : '#ffffff';
            ctx.fillRect(0, 0, width, height);
            
            // 줌과 오프셋을 고려한 표시할 캔들 수 계산
            const maxVisibleCandles = Math.max(10, Math.floor(gameState.chart.maxCandles / gameState.chart.zoom));
            const totalCandles = candleData.length;
            const endIndex = Math.min(totalCandles, totalCandles - gameState.chart.offset);
            const startIndex = Math.max(0, endIndex - maxVisibleCandles);
            const visibleCandles = endIndex - startIndex;
            const candleWidth = Math.max(2, chartWidth / maxVisibleCandles);
            
            // 가격 범위 계산
            const visibleData = candleData.slice(startIndex, endIndex);
            if (visibleData.length === 0) {
                console.log('No visible data');
                return;
            }
            
            const allPrices = visibleData.flatMap(candle => [candle.high, candle.low]);
            const minPrice = Math.min(...allPrices);
            const maxPrice = Math.max(...allPrices);
            const priceRange = Math.max(maxPrice - minPrice, 1);
            
            // 그리드 그리기
            drawGrid(padding, chartWidth, chartHeight, minPrice, maxPrice, isDark, isMobile);
            
            // 볼린저 밴드
            if (gameState.indicators.bollinger) {
                drawBollingerBands(visibleData, padding, chartWidth, chartHeight, minPrice, priceRange, candleWidth, isDark);
            }
            
            // 캔들스틱 또는 라인 차트
            if (gameState.chartType === 'candle') {
                drawCandlesticks(visibleData, padding, chartWidth, chartHeight, minPrice, priceRange, candleWidth);
            } else if (gameState.chartType === 'line') {
                drawLineChart(visibleData, padding, chartWidth, chartHeight, minPrice, priceRange, candleWidth, isDark);
            } else if (gameState.chartType === 'bar') {
                drawBarChart(visibleData, padding, chartWidth, chartHeight, minPrice, priceRange, candleWidth);
            }
            
            // 거래량 (모바일에서는 숨김)
            if (gameState.indicators.volume && !isMobile) {
                drawVolume(visibleData, padding, chartWidth, candleWidth, isDark);
            }
            
            // RSI (모바일에서는 숨김)
            if (gameState.indicators.rsi && !isMobile) {
                drawRSI(visibleData, padding, chartWidth, chartHeight, candleWidth, isDark);
            }
            
            // 그려진 도구들
            drawUserDrawings(padding, chartWidth, chartHeight, minPrice, priceRange);
            
            // 현재 그리는 중인 도구
            if (currentDrawing) {
                drawCurrentDrawing(padding, chartWidth, chartHeight, minPrice, priceRange);
            }
            
            // 십자선 그리기
            if (gameState.chart.crosshair.visible && gameState.drawingTool === 'cursor') {
                drawCrosshair(padding, chartWidth, chartHeight, minPrice, priceRange, visibleData, candleWidth, isDark, isMobile);
            }
        }

        // 그리드 그리기
        function drawGrid(padding, chartWidth, chartHeight, minPrice, maxPrice, isDark, isMobile) {
            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            
            // 수평선
            for (let i = 0; i <= 8; i++) {
                const y = padding.top + (chartHeight * i / 8);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartWidth, y);
                ctx.stroke();
                
                // 가격 레이블
                const price = maxPrice - ((maxPrice - minPrice) * i / 8);
                ctx.fillStyle = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.7)';
                ctx.font = isMobile ? '10px Arial' : '12px Arial';
                ctx.textAlign = 'right';
                ctx.fillText('₩' + Math.round(price).toLocaleString(), padding.left - 5, y + 4);
            }
            
            // 수직선
            for (let i = 0; i <= 10; i++) {
                const x = padding.left + (chartWidth * i / 10);
                ctx.beginPath();
                ctx.moveTo(x, padding.top);
                ctx.lineTo(x, padding.top + chartHeight);
                ctx.stroke();
            }
        }

        // 캔들스틱 그리기
        function drawCandlesticks(data, padding, chartWidth, chartHeight, minPrice, priceRange, candleWidth) {
            data.forEach((candle, index) => {
                const x = padding.left + (index * candleWidth) + (candleWidth / 2);
                const bodyWidth = candleWidth * 0.7;
                
                // 가격을 y 좌표로 변환
                const openY = padding.top + chartHeight - ((candle.open - minPrice) / priceRange * chartHeight);
                const closeY = padding.top + chartHeight - ((candle.close - minPrice) / priceRange * chartHeight);
                const highY = padding.top + chartHeight - ((candle.high - minPrice) / priceRange * chartHeight);
                const lowY = padding.top + chartHeight - ((candle.low - minPrice) / priceRange * chartHeight);
                
                const isRising = candle.close >= candle.open;
                const bodyColor = isRising ? '#ff4757' : '#3742fa';
                
                // 심지
                ctx.strokeStyle = bodyColor;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, highY);
                ctx.lineTo(x, lowY);
                ctx.stroke();
                
                // 몸통
                ctx.fillStyle = bodyColor;
                const bodyTop = Math.min(openY, closeY);
                const bodyHeight = Math.abs(closeY - openY) || 1;
                
                ctx.fillRect(x - bodyWidth / 2, bodyTop, bodyWidth, bodyHeight);
                
                // 테두리
                ctx.strokeStyle = bodyColor;
                ctx.strokeRect(x - bodyWidth / 2, bodyTop, bodyWidth, bodyHeight);
            });
        }

        // 라인 차트 그리기
        function drawLineChart(data, padding, chartWidth, chartHeight, minPrice, priceRange, candleWidth, isDark) {
            ctx.strokeStyle = isDark ? '#3b82f6' : '#1e40af';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            data.forEach((candle, index) => {
                const x = padding.left + (index * candleWidth) + (candleWidth / 2);
                const y = padding.top + chartHeight - ((candle.close - minPrice) / priceRange * chartHeight);
                
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            
            ctx.stroke();
        }

        // 바 차트 그리기
        function drawBarChart(data, padding, chartWidth, chartHeight, minPrice, priceRange, candleWidth) {
            data.forEach((candle, index) => {
                const x = padding.left + (index * candleWidth) + (candleWidth / 2);
                const barWidth = candleWidth * 0.8;
                
                const openY = padding.top + chartHeight - ((candle.open - minPrice) / priceRange * chartHeight);
                const closeY = padding.top + chartHeight - ((candle.close - minPrice) / priceRange * chartHeight);
                const highY = padding.top + chartHeight - ((candle.high - minPrice) / priceRange * chartHeight);
                const lowY = padding.top + chartHeight - ((candle.low - minPrice) / priceRange * chartHeight);
                
                const isRising = candle.close >= candle.open;
                ctx.strokeStyle = isRising ? '#ff4757' : '#3742fa';
                ctx.lineWidth = 2;
                
                // 고가-저가 선
                ctx.beginPath();
                ctx.moveTo(x, highY);
                ctx.lineTo(x, lowY);
                ctx.stroke();
                
                // 시가 표시
                ctx.beginPath();
                ctx.moveTo(x - barWidth/4, openY);
                ctx.lineTo(x, openY);
                ctx.stroke();
                
                // 종가 표시
                ctx.beginPath();
                ctx.moveTo(x, closeY);
                ctx.lineTo(x + barWidth/4, closeY);
                ctx.stroke();
            });
        }

        // 거래량 그리기
        function drawVolume(data, padding, chartWidth, candleWidth, isDark) {
            const volumeHeight = 80;
            const volumeY = padding.top + 400; // 차트 하단
            
            const maxVolume = Math.max(...data.map(candle => candle.volume));
            
            // 배경
            ctx.fillStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
            ctx.fillRect(padding.left, volumeY, chartWidth, volumeHeight);
            
            data.forEach((candle, index) => {
                const x = padding.left + (index * candleWidth) + (candleWidth / 2);
                const barHeight = (candle.volume / maxVolume) * (volumeHeight - 10);
                
                const isRising = candle.close >= candle.open;
                ctx.fillStyle = isRising ? 'rgba(255, 71, 87, 0.6)' : 'rgba(55, 66, 250, 0.6)';
                ctx.fillRect(x - candleWidth * 0.3, volumeY + volumeHeight - barHeight - 5, 
                           candleWidth * 0.6, barHeight);
            });
            
            // 레이블
            ctx.fillStyle = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.7)';
            ctx.font = '12px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('거래량', padding.left, volumeY - 5);
        }

        // 볼린저 밴드 그리기
        function drawBollingerBands(data, padding, chartWidth, chartHeight, minPrice, priceRange, candleWidth, isDark) {
            const period = 20;
            if (data.length < period) return;
            
            ctx.strokeStyle = isDark ? 'rgba(255,193,7,0.5)' : 'rgba(255,193,7,0.7)';
            ctx.lineWidth = 1;
            
            // 상단 밴드
            ctx.beginPath();
            data.forEach((candle, index) => {
                if (index < period - 1) return;
                
                const x = padding.left + (index * candleWidth) + (candleWidth / 2);
                const upperBand = candle.close * 1.02; // 간단한 근사치
                const y = padding.top + chartHeight - ((upperBand - minPrice) / priceRange * chartHeight);
                
                if (index === period - 1) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();
            
            // 하단 밴드
            ctx.beginPath();
            data.forEach((candle, index) => {
                if (index < period - 1) return;
                
                const x = padding.left + (index * candleWidth) + (candleWidth / 2);
                const lowerBand = candle.close * 0.98; // 간단한 근사치
                const y = padding.top + chartHeight - ((lowerBand - minPrice) / priceRange * chartHeight);
                
                if (index === period - 1) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();
        }

        // RSI 그리기
        function drawRSI(data, padding, chartWidth, chartHeight, candleWidth, isDark) {
            const rsiHeight = 60;
            const rsiY = padding.top + chartHeight + 120;
            
            // 배경
            ctx.fillStyle = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
            ctx.fillRect(padding.left, rsiY, chartWidth, rsiHeight);
            
            // RSI 선
            ctx.strokeStyle = isDark ? '#10b981' : '#059669';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            data.forEach((candle, index) => {
                const x = padding.left + (index * candleWidth) + (candleWidth / 2);
                const rsi = 50 + (Math.random() - 0.5) * 40; // 임시 RSI 값
                const y = rsiY + rsiHeight - (rsi / 100 * rsiHeight);
                
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            ctx.stroke();
            
            // 기준선 (30, 70)
            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.3)' : 'rgba(0,0,0,0.3)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            
            [30, 70].forEach(level => {
                const y = rsiY + rsiHeight - (level / 100 * rsiHeight);
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartWidth, y);
                ctx.stroke();
            });
            
            ctx.setLineDash([]);
            
            // 레이블
            ctx.fillStyle = isDark ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.7)';
            ctx.font = '12px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('RSI', padding.left, rsiY - 5);
        }

        // 사용자 그림 그리기
        function drawUserDrawings(padding, chartWidth, chartHeight, minPrice, priceRange) {
            gameState.drawings.forEach(drawing => {
                ctx.strokeStyle = '#ffa502';
                ctx.lineWidth = 2;
                
                if (drawing.type === 'trendline') {
                    ctx.beginPath();
                    ctx.moveTo(drawing.startX, drawing.startY);
                    ctx.lineTo(drawing.endX, drawing.endY);
                    ctx.stroke();
                } else if (drawing.type === 'horizontal') {
                    ctx.beginPath();
                    ctx.moveTo(padding.left, drawing.y);
                    ctx.lineTo(padding.left + chartWidth, drawing.y);
                    ctx.stroke();
                }
            });
        }

        // 현재 그리는 중인 도구
        function drawCurrentDrawing(padding, chartWidth, chartHeight, minPrice, priceRange) {
            if (!startPoint || !currentDrawing) return;
            
            ctx.strokeStyle = '#ffa502';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            
            if (gameState.drawingTool === 'trendline') {
                ctx.beginPath();
                ctx.moveTo(startPoint.x, startPoint.y);
                ctx.lineTo(currentDrawing.x, currentDrawing.y);
                ctx.stroke();
            } else if (gameState.drawingTool === 'horizontal') {
                ctx.beginPath();
                ctx.moveTo(padding.left, startPoint.y);
                ctx.lineTo(padding.left + chartWidth, startPoint.y);
                ctx.stroke();
            }
            
            ctx.setLineDash([]);
        }

        // 십자선 그리기
        function drawCrosshair(padding, chartWidth, chartHeight, minPrice, priceRange, visibleData, candleWidth, isDark, isMobile) {
            const crosshair = gameState.chart.crosshair;
            const maxPrice = minPrice + priceRange;
            
            // 십자선
            ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.5)';
            ctx.lineWidth = 1;
            ctx.setLineDash([3, 3]);
            
            // 수직선
            ctx.beginPath();
            ctx.moveTo(crosshair.x, padding.top);
            ctx.lineTo(crosshair.x, padding.top + chartHeight);
            ctx.stroke();
            
            // 수평선
            ctx.beginPath();
            ctx.moveTo(padding.left, crosshair.y);
            ctx.lineTo(padding.left + chartWidth, crosshair.y);
            ctx.stroke();
            
            ctx.setLineDash([]);
            
            // 가격 표시
            const price = maxPrice - ((crosshair.y - padding.top) / chartHeight) * priceRange;
            if (price >= minPrice && price <= maxPrice) {
                // 가격 라벨 배경
                ctx.fillStyle = isDark ? '#374151' : '#e5e7eb';
                ctx.fillRect(padding.left + chartWidth + 2, crosshair.y - 12, 75, 24);
                
                // 가격 텍스트
                ctx.fillStyle = isDark ? '#ffffff' : '#000000';
                ctx.font = isMobile ? '10px Arial' : '12px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('₩' + Math.round(price).toLocaleString(), padding.left + chartWidth + 6, crosshair.y + 4);
            }
            
            // 캔들 정보 표시
            const candleIndex = Math.floor((crosshair.x - padding.left) / candleWidth);
            if (candleIndex >= 0 && candleIndex < visibleData.length) {
                const candle = visibleData[candleIndex];
                const infoText = [
                    `시가: ₩${candle.open.toLocaleString()}`,
                    `고가: ₩${candle.high.toLocaleString()}`,
                    `저가: ₩${candle.low.toLocaleString()}`,
                    `종가: ₩${candle.close.toLocaleString()}`,
                    `거래량: ${candle.volume.toLocaleString()}`
                ];
                
                // 정보 박스 배경
                const boxWidth = isMobile ? 140 : 180;
                const boxHeight = isMobile ? 90 : 110;
                const boxX = crosshair.x + 10;
                const boxY = Math.max(10, Math.min(crosshair.y - boxHeight/2, canvas.height - boxHeight - 10));
                
                ctx.fillStyle = isDark ? 'rgba(26, 31, 46, 0.95)' : 'rgba(248, 250, 252, 0.95)';
                ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
                
                ctx.strokeStyle = isDark ? '#374151' : '#cbd5e1';
                ctx.lineWidth = 1;
                ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);
                
                // 정보 텍스트
                ctx.fillStyle = isDark ? '#ffffff' : '#000000';
                ctx.font = isMobile ? '10px Arial' : '12px Arial';
                ctx.textAlign = 'left';
                
                const lineHeight = isMobile ? 14 : 16;
                infoText.forEach((text, index) => {
                    ctx.fillText(text, boxX + 6, boxY + 16 + (index * lineHeight));
                });
            }
        }

        // 마우스 이벤트 핸들러
        function onMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (gameState.drawingTool === 'cursor') {
                // 드래그 시작
                gameState.chart.isDragging = true;
                gameState.chart.lastMouseX = x;
                canvas.style.cursor = 'grabbing';
            } else {
                // 그리기 도구
                isDrawing = true;
                startPoint = { x, y };
            }
        }

        function onMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            if (gameState.drawingTool === 'cursor') {
                // 십자선 업데이트
                gameState.chart.crosshair.x = x;
                gameState.chart.crosshair.y = y;
                gameState.chart.crosshair.visible = true;
                
                if (gameState.chart.isDragging) {
                    // 차트 드래그
                    const deltaX = x - gameState.chart.lastMouseX;
                    const sensitivity = 0.5;
                    const candleMove = Math.round(deltaX * sensitivity);
                    
                    gameState.chart.offset = Math.max(0, 
                        Math.min(gameState.stocks[gameState.selectedStock].candleData.length - 10, 
                        gameState.chart.offset - candleMove));
                    
                    gameState.chart.lastMouseX = x;
                }
                
                drawChart();
            } else if (isDrawing) {
                // 그리기 도구
                currentDrawing = { x, y };
                drawChart();
            }
        }

        function onMouseUp(e) {
            if (gameState.drawingTool === 'cursor') {
                gameState.chart.isDragging = false;
                canvas.style.cursor = 'crosshair';
            } else if (isDrawing && startPoint) {
                const rect = canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                // 그림 저장
                const drawing = {
                    type: gameState.drawingTool,
                    startX: startPoint.x,
                    startY: startPoint.y,
                    endX: x,
                    endY: y,
                    y: startPoint.y // 수평선용
                };
                
                gameState.drawings.push(drawing);
                
                isDrawing = false;
                startPoint = null;
                currentDrawing = null;
                
                drawChart();
            }
        }

        function onMouseLeave(e) {
            gameState.chart.crosshair.visible = false;
            gameState.chart.isDragging = false;
            canvas.style.cursor = gameState.drawingTool === 'cursor' ? 'default' : 'crosshair';
            drawChart();
        }

        function onWheel(e) {
            e.preventDefault();
            
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            // 차트 영역 내에서만 줌
            const padding = { top: 40, right: 80, bottom: 100, left: 60 };
            if (mouseX < padding.left || mouseX > canvas.width - padding.right ||
                mouseY < padding.top || mouseY > canvas.height - padding.bottom) {
                return;
            }
            
            const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
            const newZoom = Math.max(0.1, Math.min(5, gameState.chart.zoom * zoomFactor));
            
            // 줌 중심점 계산
            const zoomCenter = (mouseX - padding.left) / (canvas.width - padding.left - padding.right);
            const oldMaxCandles = Math.floor(gameState.chart.maxCandles / gameState.chart.zoom);
            const newMaxCandles = Math.floor(gameState.chart.maxCandles / newZoom);
            
            // 오프셋 조정 (줌 중심점 유지)
            const offsetAdjustment = Math.round((newMaxCandles - oldMaxCandles) * zoomCenter);
            gameState.chart.offset = Math.max(0, gameState.chart.offset + offsetAdjustment);
            
            gameState.chart.zoom = newZoom;
            drawChart();
        }

        // 터치 이벤트 핸들러
        function onTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            gameState.chart.isDragging = true;
            gameState.chart.lastMouseX = x;
            gameState.chart.crosshair.x = x;
            gameState.chart.crosshair.y = y;
            gameState.chart.crosshair.visible = true;
            
            drawChart();
        }

        function onTouchMove(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            
            gameState.chart.crosshair.x = x;
            gameState.chart.crosshair.y = y;
            gameState.chart.crosshair.visible = true;
            
            if (gameState.chart.isDragging) {
                const deltaX = x - gameState.chart.lastMouseX;
                const sensitivity = 0.5;
                const candleMove = Math.round(deltaX * sensitivity);
                
                gameState.chart.offset = Math.max(0, 
                    Math.min(gameState.stocks[gameState.selectedStock].candleData.length - 10, 
                    gameState.chart.offset - candleMove));
                
                gameState.chart.lastMouseX = x;
            }
            
            drawChart();
        }

        function onTouchEnd(e) {
            e.preventDefault();
            gameState.chart.isDragging = false;
            gameState.chart.crosshair.visible = false;
            drawChart();
        }

        // 차트 컨트롤 함수들
        function setChartType(type) {
            gameState.chartType = type;
            
            // 버튼 활성화 상태 업데이트
            document.querySelectorAll('.chart-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            drawChart();
        }

        function toggleIndicator(indicator) {
            gameState.indicators[indicator] = !gameState.indicators[indicator];
            event.target.classList.toggle('active');
            drawChart();
        }

        function setDrawingTool(tool) {
            gameState.drawingTool = tool;
            
            // 버튼 활성화 상태 업데이트
            document.querySelectorAll('.tool-btn').forEach(btn => {
                btn.classList.remove('active');

            // 커서 변경
            if (tool === 'cursor') {

                canvas.style.cursor = 'crosshair';
                gameState.chart.crosshair.visible = false;
            }

        }

            gameState.drawings = [];
            drawChart();
        }

        function resetZoom() {
            gameState.chart.zoom = 1;
            gameState.chart.offset = 0;
            drawChart();
        }

        // 테마 토글
        function toggleTheme() {
            gameState.theme = gameState.theme === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', gameState.theme);
