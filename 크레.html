        // 거래 관련 함수들
        function toggleLimitPrice() {
            const orderType = document.getElementById('orderType').value;
            const limitPriceGroup = document.getElementById('limitPriceGroup');
            
            if (orderType === 'limit' || orderType === 'stop') {
                limitPriceGroup.style.display = 'block';
                document.getElementById('limitPrice').value = gameState.stocks[gameState.selectedStock].price;
            } else {
                limitPriceGroup.style.display = 'none';
            }
            
            updateEstimatedAmount();
        }

        function updateEstimatedAmount() {
            const quantity = parseInt(document.getElementById('quantity').value) || 0;
            const orderType = document.getElementById('orderType').value;
            let price;
            
            if (orderType === 'market') {
                price = gameState.stocks[gameState.selectedStock].price;
            } else {
                price = parseInt(document.getElementById('limitPrice').value) || 0;
            }
            
            const totalAmount = quantity * price;
            document.getElementById('estimatedAmount').value = `₩${totalAmount.toLocaleString()}`;
        }

        function executeTrade(type) {
            const quantity = parseInt(document.getElementById('quantity').value);
            const orderType = document.getElementById('orderType').value;
            const stock = gameState.stocks[gameState.selectedStock];
            
            if (!quantity || quantity <= 0) {
                alert('올바른 수량을 입력해주세요.');
                return;
            }
            
            let price;
            if (orderType === 'market') {
                price = stock.price;
            } else {
                price = parseInt(document.getElementById('limitPrice').value);
                if (!price || price <= 0) {
                    alert('올바른 가격을 입력해주세요.');
                    return;
                }
            }
            
            const totalAmount = quantity * price;
            
            if (type === 'buy') {
                if (gameState.balance < totalAmount) {
                    alert('잔액이 부족합니다.');
                    return;
                }
                
                gameState.balance -= totalAmount;
                
                if (!gameState.portfolio[gameState.selectedStock]) {
                    gameState.portfolio[gameState.selectedStock] = {
                        quantity: 0,
                        avgPrice: 0,
                        totalCost: 0
                    };
                }
                
                const portfolio = gameState.portfolio[gameState.selectedStock];
                portfolio.totalCost += totalAmount;
                portfolio.quantity += quantity;
                portfolio.avgPrice = portfolio.totalCost / portfolio.quantity;
                
                alert(`${stock.name} ${quantity}주를 ₩${price.toLocaleString()}에 매수했습니다.`);
                
            } else {
                const portfolio = gameState.portfolio[gameState.selectedStock];
                
                if (!portfolio || portfolio.quantity < quantity) {
                    alert('보유 수량이 부족합니다.');
                    return;
                }
                
                gameState.balance += totalAmount;
                portfolio.quantity -= quantity;
                portfolio.totalCost -= quantity * portfolio.avgPrice;
                
                if (portfolio.quantity === 0) {
                    delete gameState.portfolio[gameState.selectedStock];
                }
                
                alert(`${stock.name} ${quantity}주를 ₩${price.toLocaleString()}에 매도했습니다.`);
            }
            
            updateDisplay();
            document.getElementById('quantity').value = 1;
            updateEstimatedAmount();
        }

        // 포트폴리오 렌더링
        function renderPortfolio() {
            const portfolioList = document.getElementById('portfolioList');
            const portfolioCount = Object.keys(gameState.portfolio).length;
            
            document.getElementById('portfolioCount').textContent = `${portfolioCount}개`;
            
            if (portfolioCount === 0) {
                portfolioList.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 12px;">
                        보유 종목이 없습니다
                    </div>
                `;
                return;
            }
            
            portfolioList.innerHTML = '';
            
            Object.entries(gameState.portfolio).forEach(([stockCode, portfolio]) => {
                const stock = gameState.stocks[stockCode];
                const currentValue = portfolio.quantity * stock.price;
                const profit = currentValue - (portfolio.quantity * portfolio.avgPrice);
                const profitPercent = (profit / (portfolio.quantity * portfolio.avgPrice)) * 100;
                
                const portfolioItem = document.createElement('div');
                portfolioItem.className = 'portfolio-item';
                
                const profitClass = profit >= 0 ? 'positive' : 'negative';
                const profitSign = profit >= 0 ? '+' : '';
                
                portfolioItem.innerHTML = `
                    <div>
                        <div class="portfolio-name">${stock.name}</div>
                        <div class="portfolio-quantity">${portfolio.quantity}주 (평균 ₩${Math.round(portfolio.avgPrice).toLocaleString()})</div>
                    </div>
                    <div class="portfolio-value">
                        <div style="font-weight: 600;">₩${currentValue.toLocaleString()}</div>
                        <div class="${profitClass}" style="font-size: 11px;">
                            ${profitSign}₩${Math.abs(profit).toLocaleString()} (${profitSign}${profitPercent.toFixed(2)}%)
                        </div>
                    </div>
                `;
                
                portfolioList.appendChild(portfolioItem);
            });
        }

        // 시장 업데이트
        function updateMarketData() {
            Object.keys(gameState.stocks).forEach(stockCode => {
                const stock = gameState.stocks[stockCode];
                
                // 기본 가격 변동
                let baseChange = (Math.random() - 0.5) * 0.04;
                let volumeMultiplier = 1;
                
                // 세력 거래 영향
                if (stock.orderbook && stock.orderbook.whaleInfo) {
                    const whale = stock.orderbook.whaleInfo;
                    const timeSinceWhale = Date.now() - whale.timestamp;
                    
                    // 세력 등장 후 5분간 영향
                    if (timeSinceWhale < 300000) {
                        const intensity = Math.max(0.1, 1 - (timeSinceWhale / 300000));
                        
                        if (whale.type === 'buy') {
                            // 매수세력 -> 급등
                            baseChange += 0.08 * intensity * (whale.size / 50000);
                            volumeMultiplier = 3 + (whale.size / 20000);
                        } else {
                            // 매도세력 -> 급락
                            baseChange -= 0.08 * intensity * (whale.size / 50000);
                            volumeMultiplier = 3 + (whale.size / 20000);
                        }
                        
                        // 연속 캔들 영향 (모멘텀)
                        const recentCandles = stock.candleData.slice(-3);
                        const isUptrend = recentCandles.every((candle, i) => 
                            i === 0 || candle.close > recentCandles[i-1].close);
                        const isDowntrend = recentCandles.every((candle, i) => 
                            i === 0 || candle.close < recentCandles[i-1].close);
                        
                        if ((whale.type === 'buy' && isUptrend) || (whale.type === 'sell' && isDowntrend)) {
                            baseChange *= 1.5; // 모멘텀 가속
                        }
                    }
                }
                
                const newPrice = Math.max(stock.price * (1 + baseChange), 1000);
                const priceChange = newPrice - stock.price;
                
                stock.price = Math.round(newPrice);
                stock.change = Math.round(priceChange);
                stock.changePercent = parseFloat(((priceChange / (stock.price - priceChange)) * 100).toFixed(2));
                stock.volume = Math.floor((Math.random() * 500000 + 100000) * volumeMultiplier);
                
                // 새 캔들 추가
                const lastCandle = stock.candleData[stock.candleData.length - 1];
                const newCandle = {
                    open: lastCandle.close,
                    high: Math.max(lastCandle.close, stock.price) * (1 + Math.random() * 0.01),
                    low: Math.min(lastCandle.close, stock.price) * (1 - Math.random() * 0.01),
                    close: stock.price,
                    volume: stock.volume,
                    timestamp: Date.now()
                };
                
                stock.candleData.push(newCandle);
                if (stock.candleData.length > 300) {
                    stock.candleData.shift();
                }
                
                // 호가창 업데이트
                const oldWhale = stock.orderbook ? stock.orderbook.whaleInfo : null;
                stock.orderbook = generateOrderbook(stock.price);
                
                // 새로운 세력 등장 알림
                if (stock.orderbook.whaleInfo && (!oldWhale || oldWhale.timestamp !== stock.orderbook.whaleInfo.timestamp)) {
                    if (stockCode === gameState.selectedStock) {
                        showWhaleAlert(stock.orderbook.whaleInfo, stock.name);
                    }
                }
                
                // 체결내역 업데이트
                const newTrade = {
                    price: stock.price,
                    quantity: Math.floor(Math.random() * 1000) + 100,
                    time: new Date().toLocaleTimeString(),
                    type: Math.random() > 0.5 ? 'buy' : 'sell'
                };
                stock.trades.push(newTrade);
                if (stock.trades.length > 50) {
                    stock.trades.shift();
                }
                
                // 기술적 지표 업데이트
                stock.indicators.rsi = Math.max(0, Math.min(100, stock.indicators.rsi + (Math.random() - 0.5) * 5));
                stock.indicators.macd += (Math.random() - 0.5) * 20;
                stock.indicators.bollinger = Math.max(0, Math.min(1, stock.indicators.bollinger + (Math.random() - 0.5) * 0.1));
            });
            
            // 현재 버전에 따라 적절한 렌더링 함수 호출
            const currentVersion = document.getElementById('versionSelect').value;
            
            if (currentVersion === 'mobile') {
                // 모바일 버전 업데이트
                renderMobileStockList();
                if (gameState.selectedStock) {
                    renderMobileOrderbook();
                    updateMobileDisplay();
                }
                renderMobilePortfolio();
            } else {
                // 데스크톱 버전 업데이트
                renderStockList();
                if (gameState.selectedStock) {
                    selectStock(gameState.selectedStock);
                }
                renderPortfolio();
            }
            
            // 차트는 공통으로 업데이트
            drawChart();
        }

        function updateMarketTime() {
            const now = new Date();
            document.getElementById('marketTime').textContent = now.toLocaleTimeString();
            
            // KOSPI 지수 업데이트
            const kospi = parseFloat(document.getElementById('kospiIndex').textContent.replace(',', ''));
            const newKospi = kospi + (Math.random() - 0.5) * 10;
            document.getElementById('kospiIndex').textContent = newKospi.toFixed(2);
        }

        function updateDisplay() {
            document.getElementById('balance').textContent = `₩${gameState.balance.toLocaleString()}`;
            renderPortfolio();
        }



        // 세력 알림 팝업
        function showWhaleAlert(whaleInfo, stockName) {
            const alertDiv = document.createElement('div');
            alertDiv.style.cssText = `
                position: fixed;
                top: 100px;
                right: 20px;
                background: linear-gradient(135deg, #ffc107, #ff8f00);
                color: #000;
                padding: 15px 20px;
                border-radius: 10px;
                font-weight: bold;
                font-size: 14px;
                box-shadow: 0 4px 20px rgba(255, 193, 7, 0.4);
                z-index: 10000;
                animation: slideIn 0.5s ease-out;
                border: 2px solid #ff8f00;
            `;
            
            const whaleType = whaleInfo.type === 'buy' ? '매수세력' : '매도세력';
            const whaleSize = (whaleInfo.size / 10000).toFixed(1);
            const direction = whaleInfo.type === 'buy' ? '🚀 급등' : '💥 급락';
            
            alertDiv.innerHTML = `
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-size: 20px;">🐋</span>
                    <div>
                        <div>${stockName} ${whaleType} 등장!</div>
                        <div style="font-size: 12px; margin-top: 2px;">
                            ${whaleSize}만주 물량 → ${direction} 예상
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(alertDiv);
            
            // 3초 후 제거
            setTimeout(() => {
                alertDiv.style.animation = 'slideOut 0.5s ease-in';
                setTimeout(() => {
                    if (alertDiv.parentNode) {
                        alertDiv.parentNode.removeChild(alertDiv);
                    }
                }, 500);
            }, 3000);
        }

        function startMarketUpdates() {
            setInterval(updateMarketData, 2000); // 2초마다 시장 데이터 업데이트
            setInterval(updateMarketTime, 1000); // 1초마다 시간 업데이트
        }

        // 버전 전환 함수
        function switchVersion() {

            const desktopLayout = document.getElementById('desktopLayout');
            const mobileLayout = document.getElementById('mobileLayout');
            
            if (version === 'mobile') {
                desktopLayout.style.display = 'none';
                mobileLayout.classList.add('active');
                
                // 모바일 캔버스 설정
                setTimeout(() => {
                    const mobileCanvas = document.getElementById('mobileMainChart');
                    if (mobileCanvas) {
                        canvas = mobileCanvas;
                        ctx = canvas.getContext('2d');
                        
                        // 캔버스 크기 설정
                        const container = mobileCanvas.parentElement;
                        mobileCanvas.width = container.clientWidth;
                        mobileCanvas.height = container.clientHeight;
                        
                        console.log('Mobile canvas size:', mobileCanvas.width, mobileCanvas.height);
                        
                        drawChart();
                    }

                // 모바일 UI 초기화

                    if (desktopCanvas) {

                        ctx = canvas.getContext('2d');
                        
                        // 캔버스 크기 설정
                        const container = desktopCanvas.parentElement;
                        desktopCanvas.width = container.clientWidth;
                        desktopCanvas.height = container.clientHeight;
                        
                        console.log('Desktop canvas size:', desktopCanvas.width, desktopCanvas.height);
                        
                        drawChart();
                    }
                }, 200);
                
                // 데스크톱 UI 초기화
                setTimeout(() => {
                    renderStockList();
                    renderOrderbook();
                    renderPortfolio();

                }, 300);
            }
        }

        // 모바일 차트 컨트롤 함수들
        function setMobileChartType(type) {
            gameState.chartType = type;
            
            // 버튼 활성화 상태 업데이트
            document.querySelectorAll('.mobile-chart-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            drawChart();
        }

        function resetMobileZoom() {
            gameState.chart.zoom = 1;
            gameState.chart.offset = 0;
            drawChart();
        }

        // 모바일 주식 목록 렌더링
        function renderMobileStockList() {
            const mobileStockList = document.getElementById('mobileStockList');
            if (!mobileStockList) return;
            
            mobileStockList.innerHTML = '';
            
            Object.entries(gameState.stocks).forEach(([code, stock]) => {
                const stockItem = document.createElement('div');
                stockItem.className = `mobile-stock-item ${code === gameState.selectedStock ? 'selected' : ''}`;
                stockItem.onclick = () => {
                    gameState.selectedStock = code;
                    renderMobileStockList();
                    renderMobileOrderbook();
                    updateMobileDisplay();
                    drawChart();
                };
                
                const changeClass = stock.change >= 0 ? 'positive' : 'negative';
                const changeSign = stock.change >= 0 ? '+' : '';
                
                let trendEmoji = stock.changePercent > 3 ? '🚀' : 
                                stock.changePercent > 1 ? '📈' : 
                                stock.changePercent < -3 ? '💥' : 
                                stock.changePercent < -1 ? '📉' : '➡️';
                
                stockItem.innerHTML = `
                    <div class="mobile-stock-info">
                        <div class="mobile-stock-name">${trendEmoji} ${stock.name}</div>
                        <div class="mobile-stock-code">${stock.code}</div>
                    </div>
                    <div class="mobile-stock-price-info">
                        <div class="mobile-stock-price">₩${stock.price.toLocaleString()}</div>
                        <div class="mobile-stock-change ${changeClass}">
                            ${changeSign}${stock.change.toLocaleString()} (${changeSign}${stock.changePercent}%)
                        </div>
                    </div>
                `;
                
                mobileStockList.appendChild(stockItem);
            });
        }

        // 모바일 호가창 렌더링
        function renderMobileOrderbook() {
            const stock = gameState.stocks[gameState.selectedStock];
            const mobileOrderbookList = document.getElementById('mobileOrderbookList');
            
            if (!stock || !mobileOrderbookList) return;
            
            mobileOrderbookList.innerHTML = '';
            
            // 세력 알림 표시
            if (stock.orderbook && stock.orderbook.whaleInfo) {
                const whaleAlert = document.createElement('div');
                whaleAlert.style.cssText = `
                    background: linear-gradient(45deg, #ffc107, #ff8f00);
                    color: #000;
                    padding: 4px 6px;
                    text-align: center;
                    font-size: 9px;
                    font-weight: bold;
                    margin-bottom: 2px;
                    border-radius: 3px;
                `;
                const whaleType = stock.orderbook.whaleInfo.type === 'buy' ? '매수세력' : '매도세력';
                const whaleSize = (stock.orderbook.whaleInfo.size / 10000).toFixed(1);
                whaleAlert.innerHTML = `🐋 ${whaleType} ${whaleSize}만주`;
                mobileOrderbookList.appendChild(whaleAlert);
            }
            
            // 매도 호가 (상위 3개)
            if (stock.orderbook && stock.orderbook.asks) {
                stock.orderbook.asks.slice().reverse().slice(0, 3).forEach(ask => {
                    const row = document.createElement('div');
                    row.className = 'mobile-orderbook-row ask';
                    row.onclick = () => setMobileOrderPrice(ask.price);
                    
                    row.innerHTML = `
                        <div class="quantity">${ask.quantity.toLocaleString()}${ask.isWhale ? ' 🐋' : ''}</div>
                        <div class="price">₩${ask.price.toLocaleString()}</div>
                        <div class="quantity"></div>
                    `;
                    
                    if (ask.isWhale) {
                        row.style.borderLeft = '2px solid #ffc107';
                        row.style.fontWeight = 'bold';
                    }
                    
                    mobileOrderbookList.appendChild(row);
                });
            }
            
            // 현재가
            const currentRow = document.createElement('div');
            currentRow.className = 'mobile-orderbook-row current';
            currentRow.innerHTML = `
                <div style="font-size: 8px;">현재가</div>
                <div class="price">₩${stock.price.toLocaleString()}</div>
                <div style="font-size: 8px;">${stock.change >= 0 ? '▲' : '▼'}</div>
            `;
            mobileOrderbookList.appendChild(currentRow);
            
            // 매수 호가 (하위 3개)
            if (stock.orderbook && stock.orderbook.bids) {
                stock.orderbook.bids.slice(0, 3).forEach(bid => {
                    const row = document.createElement('div');
                    row.className = 'mobile-orderbook-row bid';
                    row.onclick = () => setMobileOrderPrice(bid.price);
                    
                    row.innerHTML = `
                        <div class="quantity">${bid.quantity.toLocaleString()}${bid.isWhale ? ' 🐋' : ''}</div>
                        <div class="price">₩${bid.price.toLocaleString()}</div>
                        <div class="quantity"></div>
                    `;
                    
                    if (bid.isWhale) {
                        row.style.borderLeft = '2px solid #ffc107';
                        row.style.fontWeight = 'bold';
                    }
                    
                    mobileOrderbookList.appendChild(row);
                });
            }
        }
        
        // 모바일 호가 클릭시 주문가격 설정
        function setMobileOrderPrice(price) {
            document.getElementById('mobileLimitPrice').value = price;
            document.getElementById('mobileOrderType').value = 'limit';
            toggleMobileLimitPrice();
            updateMobileEstimatedAmount();
        }

        // 모바일 포트폴리오 렌더링
        function renderMobilePortfolio() {
            const mobilePortfolioList = document.getElementById('mobilePortfolioList');
            const portfolioCount = Object.keys(gameState.portfolio).length;
            
            document.getElementById('mobilePortfolioCount').textContent = `${portfolioCount}개`;
            
            if (portfolioCount === 0) {
                mobilePortfolioList.innerHTML = `
                    <div style="text-align: center; color: var(--text-muted); padding: 20px; font-size: 10px;">
                        보유 종목이 없습니다
                    </div>
                `;
                return;
            }
            
            mobilePortfolioList.innerHTML = '';
            
            Object.entries(gameState.portfolio).forEach(([stockCode, portfolio]) => {
                const stock = gameState.stocks[stockCode];
                const currentValue = portfolio.quantity * stock.price;
                const profit = currentValue - (portfolio.quantity * portfolio.avgPrice);
                const profitPercent = (profit / (portfolio.quantity * portfolio.avgPrice)) * 100;
                
                const portfolioItem = document.createElement('div');
                portfolioItem.className = 'mobile-portfolio-item';
                
                const profitClass = profit >= 0 ? 'positive' : 'negative';
                const profitSign = profit >= 0 ? '+' : '';
                
                portfolioItem.innerHTML = `
                    <div>
                        <div class="mobile-portfolio-name">${stock.name}</div>
                        <div class="mobile-portfolio-quantity">${portfolio.quantity}주 (평균 ₩${Math.round(portfolio.avgPrice).toLocaleString()})</div>
                    </div>
                    <div class="mobile-portfolio-value">
                        <div style="font-weight: 600;">₩${currentValue.toLocaleString()}</div>
                        <div class="${profitClass}" style="font-size: 9px;">
                            ${profitSign}₩${Math.abs(profit).toLocaleString()} (${profitSign}${profitPercent.toFixed(2)}%)
                        </div>
                    </div>
                `;
                
                mobilePortfolioList.appendChild(portfolioItem);
            });
        }

        // 모바일 지정가 토글
        function toggleMobileLimitPrice() {
            const orderType = document.getElementById('mobileOrderType').value;
            const limitPriceGroup = document.getElementById('mobileLimitPriceGroup');
            
            if (orderType === 'limit' || orderType === 'stop') {
                limitPriceGroup.style.display = 'block';
                document.getElementById('mobileLimitPrice').value = gameState.stocks[gameState.selectedStock].price;
            } else {
                limitPriceGroup.style.display = 'none';
            }
            
            updateMobileEstimatedAmount();
        }

        // 모바일 거래 함수
        function executeMobileTrade(type) {
            const quantity = parseInt(document.getElementById('mobileQuantity').value);
            const orderType = document.getElementById('mobileOrderType').value;
            const stock = gameState.stocks[gameState.selectedStock];
            
            if (!quantity || quantity <= 0) {
                alert('올바른 수량을 입력해주세요.');
                return;
            }
            
            let price;
            if (orderType === 'market') {
                price = stock.price;
            } else {
                price = parseInt(document.getElementById('mobileLimitPrice').value);
                if (!price || price <= 0) {
                    alert('올바른 가격을 입력해주세요.');
                    return;
                }
            }
            
            const totalAmount = quantity * price;
            
            if (type === 'buy') {
                if (gameState.balance < totalAmount) {
                    alert('잔액이 부족합니다.');
                    return;
                }
                
                gameState.balance -= totalAmount;
                
                if (!gameState.portfolio[gameState.selectedStock]) {
                    gameState.portfolio[gameState.selectedStock] = {
                        quantity: 0,
                        avgPrice: 0,
                        totalCost: 0
                    };
                }
                
                const portfolio = gameState.portfolio[gameState.selectedStock];
                portfolio.totalCost += totalAmount;
                portfolio.quantity += quantity;
                portfolio.avgPrice = portfolio.totalCost / portfolio.quantity;
                
                alert(`${stock.name} ${quantity}주를 ₩${price.toLocaleString()}에 매수했습니다.`);
                
            } else {
                const portfolio = gameState.portfolio[gameState.selectedStock];
                
                if (!portfolio || portfolio.quantity < quantity) {
                    alert('보유 수량이 부족합니다.');
                    return;
                }
                
                gameState.balance += totalAmount;
                portfolio.quantity -= quantity;
                portfolio.totalCost -= quantity * portfolio.avgPrice;
                
                if (portfolio.quantity === 0) {
                    delete gameState.portfolio[gameState.selectedStock];
                }
                
                alert(`${stock.name} ${quantity}주를 ₩${price.toLocaleString()}에 매도했습니다.`);
            }
            
            updateMobileDisplay();
            renderMobilePortfolio();
            document.getElementById('mobileQuantity').value = 1;
            updateMobileEstimatedAmount();
        }

        // 모바일 디스플레이 업데이트
        function updateMobileDisplay() {
            const stock = gameState.stocks[gameState.selectedStock];
            if (!stock) return;
            
            // 차트 헤더 업데이트
            const mobileChartStockName = document.getElementById('mobileChartStockName');
            const mobileChartStockPrice = document.getElementById('mobileChartStockPrice');
            
            if (mobileChartStockName) {
                mobileChartStockName.textContent = stock.name;
            }
            
            if (mobileChartStockPrice) {
                const changeClass = stock.change >= 0 ? 'positive' : 'negative';
                const changeSign = stock.change >= 0 ? '+' : '';
                mobileChartStockPrice.textContent = 
                    `₩${stock.price.toLocaleString()} (${changeSign}${stock.change.toLocaleString()})`;
                mobileChartStockPrice.className = changeClass;
            }
            
            updateMobileEstimatedAmount();
        }

        // 모바일 예상 금액 업데이트
        function updateMobileEstimatedAmount() {
            const quantity = parseInt(document.getElementById('mobileQuantity').value) || 0;
            const orderType = document.getElementById('mobileOrderType').value;
            let price;
            
            if (orderType === 'market') {
                price = gameState.stocks[gameState.selectedStock].price;
            } else {
                price = parseInt(document.getElementById('mobileLimitPrice').value) || 0;
            }
            
            const totalAmount = quantity * price;
            document.getElementById('mobileEstimatedAmount').value = `₩${totalAmount.toLocaleString()}`;
        }

        // 모바일 이벤트 리스너 추가
        function addMobileEventListeners() {
            document.getElementById('mobileOrderType').addEventListener('change', toggleMobileLimitPrice);
            document.getElementById('mobileQuantity').addEventListener('input', updateMobileEstimatedAmount);
            document.getElementById('mobileLimitPrice').addEventListener('input', updateMobileEstimatedAmount);
        }

        // 초기화 실행
        init();
        addMobileEventListeners();
    </script>
